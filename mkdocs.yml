site_name: H-hat quantum programming language
site_url: https://docs.hhat-lang.org/
site_description: A rule system, compiler framework, and statically typed quantum programming language
site_author: H-hat Community

repo_url: "https://github.com/hhat-lang/hhat_lang/"
repo_name: hhat-lang/hhat_lang
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2025-2026 H-hat Contributors

nav:
  - Introduction:
      - Welcome: index.md
      - Why H-hat?: introduction/why_hhat.md
      - Features & Goals: introduction/features.md
      - Project Status: introduction/status.md
  - Getting Started:
      - Quick Start: getting_started.md
      - Installation:
          - Python Guide: python/python_guide.md
          - Rust Guide: rust/rust_guide.md
      - Your First Program: getting_started/first_program.md
      - Tools & Toolchain: toolchain.md
      - CLI Reference: cli.md
      - Running H-hat: running_hhat.md
  - Language Concepts:
      - core/index.md
      - Core Concepts:
          - Rule System: rule_system.md
          - Language Design: core/language_design.md
          - Compiler Framework: core/compiler_framework.md
          - Nomenclature: core/naming.md
      - Type System:
          - Types Overview: concepts/types.md
          - Quantum Types: concepts/quantum_types.md
          - Cast System: concepts/casting.md
      - Memory & Ownership:
          - Ownership Model: concepts/ownership.md
          - Memory Management: concepts/memory.md
      - Advanced Topics:
          - Concurrency: concepts/concurrency.md
          - Meta-programming: concepts/metaprogramming.md
  - Dialects:
      - dialects/index.md
      - Heather:
          - dialects/heather/index.md
          - Syntax: dialects/heather/syntax.md
          - Grammar: dialects/heather/grammar.md
          - Syntax Highlighting: dialects/heather/syntax_highlighting.md
  - Examples:
      - examples/index.md
      - Basic Examples:
          - First Code: examples/basic/first_code.md
          - Variables & Types: examples/basic/variables.md
          - Functions: examples/basic/functions.md
      - Quantum Examples:
          - Quantum Types: examples/quantum/quantum_types.md
          - Casting Quantum: examples/quantum/casting.md
          - Quantum Operations: examples/quantum/operations.md
          - Syntax Highlighting Demo: examples/quantum/syntax_demo.md
      - Advanced Examples:
          - Custom Types: examples/advanced/custom_types.md
          - Calling Functions: examples/advanced/calling_functions.md
  - Community & Support:
      - community/index.md
      - Get Help: community/get_help.md
      - Discussion Forums: community/discussions.md
      - Code of Conduct: community/code_of_conduct.md
  - Contributing:
      - contributing/index.md
      - How to Contribute: contributing/guide.md
      - Development Setup: contributing/development.md
      - Documentation: core/doc_design.md
      - Pull Requests: contributing/pull_requests.md
  - Brand & Design:
      - Visual Identity: brand/visual_identity.md
  - Blog:
      - blog/index.md

markdown_extensions:
  - abbr
  - attr_list
  - def_list
  - admonition
  - footnotes
  - md_in_html
  - pymdownx.inlinehilite
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      linenums: true
      linenums_style: pymdownx.inline
      line_spans: __span
      pygments_lang_class: true
      pygments_style: hhat-dark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.superfences:
      custom_fences:
        - name: python
          class: python
          validator: "!!python/name:markdown_exec.validator"
          format: "!!python/name:markdown_exec.formatter"
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - toc:
      permalink: true

plugins:
  - privacy
  - search
  - blog:
      blog_toc: true
      post_date_format: full
      post_excerpt: required
      categories_allowed:
        - Roadmap
        - Technical
        - Demo
        - Use-cases
        - Deepdive
        - Special
        - Announcement
        - News
        - Thoughts
  - meta
  - tags


extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
  - stylesheets/hhat-colors.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hhat-lang/hhat_lang
      name: H-hat on GitHub
    - icon: fontawesome/brands/discord
      link: http://discord.unitary.foundation
      name: Join us on Discord
    - icon: fontawesome/solid/globe
      link: https://unitary.foundation
      name: Unitary Foundation
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            opening an issue on GitHub.
  generator: false

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  logo: hhat_logo.svg
  favicon: hhat_logo.ico
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
