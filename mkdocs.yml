site_name: H-hat
site_url: https://docs.hhat-lang.org/
site_author: H-hat team
site_description: H-hat is a rule system, compiler framework, and a statically typed, functional and distributed system inspired, quantum programming language.

repo_url: https://github.com/hhat-lang/hhat_lang/
repo_name: hhat-lang/hhat_lang

nav:
  - Home: index.md
  - Start:
      - start/index.md
      - Status & Roadmap:
          - start/status_roadmap/index.md
          - Roadmap: start/status_roadmap/roadmap.md
      - What, Why, How H-hat: start/what_why_how.md
  - Guides:
      - guides/index.md
  - Reference:
      - reference/index.md
      - Glossary: reference/glossary.md
      - Heather dialect:
          - reference/dialects/heather/index.md
          - Syntax: reference/dialects/heather/syntax.md
          - Grammar: reference/dialects/heather/grammar.md
      - Rule System: reference/rulesystem/index.md
      - H-hat Dialects: reference/dialects/index.md
      - Compiler framework: reference/compiler/index.md
      - Toolchain framework: reference/toolchain/index.md
      - Building a Dialect: reference/dialects/build_your_own_dialect.md
  - Tutorials:
      - tutorials/index.md
  - Research:
      - research/index.md
  - Blog:
      - blog/index.md
  - Contributing: how_to_contribute.md

markdown_extensions:
  - abbr
  - pymdownx.inlinehilite
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.snippets
  - attr_list
  - def_list
  - admonition
  - footnotes
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      linenums: true
      linenums_style: pymdownx.inline
      line_spans: __span
      pygments_lang_class: true
      noclasses: false
  - pymdownx.superfences:
      custom_fences:
        - name: python
          class: python
          validator: "!!python/name:markdown_exec.validator"
          format: "!!python/name:markdown_exec.formatter"
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - toc:
      permalink: true

plugins:
  - search
  - social
  - blog:
      blog_toc: true
      post_date_format: full
      post_excerpt: required
      categories_allowed:
        - Roadmap
        - Technical
        - Demo
        - Use-cases
        - Deepdive
        - Special
        - Announcement
        - News
        - Thoughts
  - meta
  - tags
  - hhat-heather-pygments
  #- privacy      #this plugin is breaking local build, need to investigate


extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo_light.png
  favicon: assets/favicon.ico
  font:
    text: Lexend
    code: Space Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-2
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tabs
    - navigation.footer
    - content.code.copy
    - content.tooltips
    - content.code.annotate
    - toc.follow
 
