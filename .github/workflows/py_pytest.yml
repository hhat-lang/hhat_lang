name: py_pytest

on:
  pull_request:
    branches: [main, "dev/**"]
  push:
    branches: [main, "dev/**"]

permissions:
  contents: read

jobs:
  detect-python:
    name: Detect Python sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-python: ${{ steps.detect.outputs.has-python }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if git ls-files "python/**" | grep -q .; then
            echo "has-python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-python=false" >> "$GITHUB_OUTPUT"
          fi

  pytest:
    name: Python ${{ matrix.python-version }} pytest (${{ matrix.os }})
    needs: detect-python
    if: needs.detect-python.outputs.has-python == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install dependencies
        run: python -m pip install ".[all,dev]"
      - name: Run tests
        run: pytest .
