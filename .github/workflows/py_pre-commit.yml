name: py_pre-commit

on:
  pull_request:
    branches: [main, "dev/**"]
  push:
    branches: [main, "dev/**"]

permissions:
  contents: read

jobs:
  detect-python:
    name: Detect Python sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-python: ${{ steps.detect.outputs.has-python }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if git ls-files "python/**" | grep -q .; then
            echo "has-python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-python=false" >> "$GITHUB_OUTPUT"
          fi

  pre-commit:
    name: Python pre-commit (${{ matrix.os }})
    needs: detect-python
    if: needs.detect-python.outputs.has-python == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
