name: py_pre-commit

on:
  push:
    branches: [main, dev/python]
  pull_request:
    branches: [main, dev/python]

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Detect Python sources
        id: python
        shell: bash
        run: |
          if [ -f python/pyproject.toml ] && find python -type f -name '*.py' | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python ${{ matrix.python-version }}
        if: steps.python.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install pre-commit
        if: steps.python.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit

      - name: Run pre-commit
        if: steps.python.outputs.present == 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            pre-commit run \
              --from-ref "origin/${{ github.base_ref }}" \
              --to-ref HEAD \
              --show-diff-on-failure \
              --config python/.pre-commit-config.yaml
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            pre-commit run \
              --from-ref "${{ github.event.before }}" \
              --to-ref "${{ github.sha }}" \
              --show-diff-on-failure \
              --config python/.pre-commit-config.yaml
          else
            pre-commit run --all-files --show-diff-on-failure --config python/.pre-commit-config.yaml
          fi
