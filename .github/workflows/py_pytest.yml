name: py_pytest

on:
  push:
    branches: [main, dev/python]
  pull_request:
    branches: [main, dev/python]

jobs:
  pytest:
    name: pytest / py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Detect Python project
        id: python
        shell: bash
        run: |
          if [[ -f python/pyproject.toml ]] && git ls-files 'python/**/*.py' | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.python.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install dependencies
        if: steps.python.outputs.present == 'true'
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[all,dev]"

      - name: Run smoke tests
        if: steps.python.outputs.present == 'true'
        working-directory: python
        run: |
          pytest \
            tests/core/test_index.py \
            tests/core/test_types.py \
            tests/dialects/heather/parsing/test_code_parsing.py \
            tests/test_cli.py \
            tests/test_lexer.py

      - name: Skip Python checks
        if: steps.python.outputs.present != 'true'
        run: echo "No Python package was detected."
