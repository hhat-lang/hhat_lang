[package]
name = "hhat_rules"
version = "0.0.0"
authors = ["Doomsk <eduardo.maschio@hhat-lang.org>"]
description = "A `cargo generate` template for quick-starting a procedural macro crate"
keywords = ["template", "proc_macro", "procmacro"]
edition = "2018"

[lib]
proc-macro = true

[dependencies]
quote = "1"
proc-macro2 = "1.0"
syn = "1.0"

