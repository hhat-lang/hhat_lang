name: py_build

on:
  push:
    branches: [main, dev/python]
  pull_request:
    branches: [main, dev/python]

permissions:
  contents: read

jobs:
  build:
    name: build / py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Detect Python package
        id: python
        shell: bash
        run: |
          if [ -f python/pyproject.toml ] && find python -type f -name '*.py' | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python ${{ matrix.python-version }}
        if: steps.python.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install package and core dependencies
        if: steps.python.outputs.present == 'true'
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[heather]"

      - name: Compile Python sources
        if: steps.python.outputs.present == 'true'
        working-directory: python
        run: python -m compileall -q src tests
