name: lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout H-hat
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install pre-commit
      run: |
        pip install pre-commit
        pre-commit install

    - name: Perform pre-commit
      run: |
        pre-commit run --all-files
